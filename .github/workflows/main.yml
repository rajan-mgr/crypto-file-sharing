name: SecureShare CI + Release (PKI Enabled)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cryptoshare-backend

# =========================================================
# 1️⃣ TEST BACKEND WITH PKI
# =========================================================
jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cow
          POSTGRES_PASSWORD: cow123
          POSTGRES_DB: cryptoshare
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://cow:cow123@localhost:5432/cryptoshare
      SECRET_KEY: ci-secret-key-not-for-production
      CA_KEY_PATH: ./pki/ca.key
      CA_CERT_PATH: ./pki/ca.crt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install requests cryptography bandit pylint

      - name: Run Bandit
        run: bandit -r backend -ll || true

      - name: Run Pylint
        run: pylint backend/*.py || true

      - name: Setup Certificate Authority
        run: |
          cd backend
          python setup_ca.py

      - name: Start Backend
        run: |
          cd backend
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 10
          curl http://127.0.0.1:8000/ || exit 1

      - name: Run Test Suite
        run: python test_app.py

# =========================================================
# 2️⃣ BUILD BACKEND DOCKER IMAGE
# =========================================================
  build-backend:
    needs: backend-tests
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cryptoshare-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/cryptoshare-backend:latest

# =========================================================
# 3️⃣ BUILD GUI EXECUTABLES (SPEC FILE – STABLE)
# =========================================================
  build-frontend-executables:
    needs: backend-tests
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SecureShare-Linux
            output_file: SecureShare
          - os: windows-latest
            artifact_name: SecureShare-Windows
            output_file: SecureShare.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GUI dependencies
        run: |
          pip install -r gui/requirements.txt
          pip install pyinstaller

      - name: Create PyInstaller spec file
        shell: bash
        run: |
          cd gui
          cat > SecureShare.spec << 'EOF'
          # -*- mode: python ; coding: utf-8 -*-

          block_cipher = None

          a = Analysis(
              ['app.py'],
              pathex=['.'],
              binaries=[],
              datas=[('secure_share.py', '.')],
              hiddenimports=[
                  'secure_share',
                  'cryptography',
                  'cryptography.fernet',
                  'cryptography.hazmat',
                  'cryptography.hazmat.primitives',
                  'cryptography.hazmat.backends',
                  'requests',
                  'tkinter',
                  'tkinter.ttk',
                  'tkinter.messagebox',
                  'tkinter.filedialog',
                  'tkinter.scrolledtext',
              ],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              cipher=block_cipher,
              noarchive=False,
          )

          pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.zipfiles,
              a.datas,
              [],
              name='SecureShare',
              console=False,
          )
          EOF

      - name: Build executable
        shell: bash
        run: |
          cd gui
          pyinstaller SecureShare.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: gui/dist/${{ matrix.output_file }}

# =========================================================
# 4️⃣ PACKAGE GUI SOURCE
# =========================================================
  package-gui-source:
    needs: backend-tests
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Package GUI source
        run: |
          mkdir -p gui-source/SecureShare-GUI
          cp -r gui/* gui-source/SecureShare-GUI/

          cd gui-source
          tar -czf SecureShare-GUI-Source-${{ github.ref_name }}.tar.gz SecureShare-GUI
          zip -r SecureShare-GUI-Source-${{ github.ref_name }}.zip SecureShare-GUI

      - uses: actions/upload-artifact@v4
        with:
          name: GUI-Source
          path: gui-source/*

# =========================================================
# 5️⃣ CREATE RELEASE (FIXED – NO 422 ERROR)
# =========================================================
  create-release:
    needs: [build-backend, build-frontend-executables, package-gui-source]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create backend deployment package
        run: |
          mkdir deploy
          cp docker-compose.yml deploy/
          tar -czf cryptoshare-deploy-${{ github.ref_name }}.tar.gz deploy

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: SecureShare ${{ github.ref_name }}
          files: |
            cryptoshare-deploy-${{ github.ref_name }}.tar.gz
            release-assets/SecureShare-Linux/**
            release-assets/SecureShare-Windows/**
            release-assets/GUI-Source/*.tar.gz
            release-assets/GUI-Source/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Security Scan + Release CI

on:
  push:
    branches: [main]
    tags: ['v*'] # Triggers when you push a version tag like v1.0, v2.1.4
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create Releases
      packages: write   # Required to push to GHCR.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pylint pytest bandit cryptography psycopg2-binary python-dotenv

      - name: Run pylint (Code Quality)
        # exit-zero ensures the build doesn't fail on style warnings
        run: pylint core/ utils.py --exit-zero

      - name: Run Bandit (SAST - Security Scan)
        run: bandit -r . -ll -x ./venv

      - name: Run pytest (Functional Tests)
        run: python -m unittest test.py

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/secureshare:latest
            ghcr.io/${{ github.repository_owner }}/secureshare:${{ github.ref_name }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: SecureShare Release ${{ github.ref_name }}
          body: |
            ## New Release: ${{ github.ref_name }}
            
            ### Deployment
            Pull the latest package:
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/secureshare:${{ github.ref_name }}
            ```
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Security Scan + Release CI

on:
  push:
    branches: [main]
    tags: ['v*'] # Triggers on version tags like v1.0.0, v2.1.4
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.event.repository.name }}  # This will be "crypto-file-sharing"

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
   
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cow
          POSTGRES_PASSWORD: cow123
          POSTGRES_DB: cryptoshare
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
   
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
     
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
     
      - name: Install backend dependencies
        run: |
          pip install pylint bandit pytest
          pip install -r backend/requirements.txt
     
      - name: Install GUI dependencies
        run: |
          pip install -r gui/requirements.txt
     
      - name: Run Pylint (Backend Code Quality)
        run: |
          pylint backend/*.py --exit-zero || true
        continue-on-error: true
     
      - name: Run Bandit (SAST Security Scan)
        run: |
          bandit -r . --exit-zero
          bandit -r backend/ gui/ --exit-zero || true
        continue-on-error: true
     
      - name: Start Backend Server
        env:
          DATABASE_URL: postgresql://cow:cow123@localhost:5432/cryptoshare
          SECRET_KEY: test-secret-key-for-ci-only-not-for-production-use
        run: |
          cd backend
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl http://localhost:8000/ || exit 1
     
      - name: Run Backend Tests
        run: |
          python test_app.py
        timeout-minutes: 5

  build-and-push-backend:
    needs: security-and-tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
   
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
     
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
     
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}  # Consider switching to secrets.GITHUB_TOKEN if possible
     
      - name: Extract metadata for Backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
     
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend-executables:
    needs: security-and-tests
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: CryptoShare-Linux
            build_command: pyinstaller --onefile --name CryptoShare gui/app.py
          - os: windows-latest
            artifact_name: CryptoShare-Windows.exe
            build_command: pyinstaller --onefile --windowed --name CryptoShare gui/app.py
   
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
     
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
     
      - name: Install dependencies
        run: |
          pip install -r gui/requirements.txt
          pip install pyinstaller
     
      - name: Build executable
        run: ${{ matrix.build_command }}
     
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/CryptoShare*
            !dist/**/*.pyc

  create-release:
    needs: [build-and-push-backend, build-frontend-executables]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
   
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
     
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
     
      - name: Create deployment package
        run: |
          mkdir -p deploy-package
         
          # Copy docker-compose for production
          cp docker-compose.yml deploy-package/docker-compose.yml
         
          # Create .env template
          cat > deploy-package/.env.example << 'EOF'
          # PostgreSQL Configuration
          POSTGRES_USER=cow
          POSTGRES_PASSWORD=CHANGE_THIS_PASSWORD
          POSTGRES_DB=cryptoshare
         
          # Backend Configuration
          SECRET_KEY=CHANGE_THIS_TO_A_LONG_RANDOM_STRING
          DATABASE_URL=postgresql://cow:CHANGE_THIS_PASSWORD@db:5432/cryptoshare
          EOF
         
          # Create README
          cat > deploy-package/README.md << 'EOF'
          # CryptoShare Deployment Guide
         
          ## Quick Start
         
          ### 1. Pull the Docker images
          ```bash
          docker pull ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          docker pull postgres:15-alpine

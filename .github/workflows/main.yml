name: SecureShare CI (PKI + Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cow
          POSTGRES_PASSWORD: cow123
          POSTGRES_DB: cryptoshare
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://cow:cow123@localhost:5432/cryptoshare
      SECRET_KEY: ci-test-secret-key-not-for-production
      CA_KEY_PATH: ./pki/ca.key
      CA_CERT_PATH: ./pki/ca.crt

    steps:
      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Python setup
      # -------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------------------------------
      # Install dependencies
      # -------------------------------------------------
      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit pylint requests cryptography

      # -------------------------------------------------
      # Static analysis (non-blocking)
      # -------------------------------------------------
      - name: Run Bandit (Security Scan)
        run: bandit -r backend -ll || true

      - name: Run Pylint (Code Quality)
        run: pylint backend/*.py || true

      # -------------------------------------------------
      # PKI setup (CRITICAL)
      # -------------------------------------------------
      - name: Create PKI (Certificate Authority)
        run: |
          cd backend
          python setup_ca.py
          ls -lh pki/

      # -------------------------------------------------
      # Start backend
      # -------------------------------------------------
      - name: Start SecureShare backend
        run: |
          cd backend
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 10
          curl http://127.0.0.1:8000/ || exit 1

      # -------------------------------------------------
      # Run PKI-aware tests
      # -------------------------------------------------
      - name: Run SecureShare test suite
        run: |
          python test_app.py

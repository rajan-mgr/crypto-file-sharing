name: Security Scan + Release CI

on:
  push:
    branches: [main]
    tags: ['v*'] # Triggers when you push a tag like v1.0
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create Releases
      packages: write   # Required to push to GHCR.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          pip install pylint pytest bandit cryptography psycopg2-binary python-dotenv

      - name: Run pylint (Code Quality)
        # We use exit-zero so the build doesn't fail on style warnings, only errors
        run: pylint core/ utils.py --exit-zero

      - name: Run Bandit (SAST - Security Scan)
        run: bandit -r . -ll -x ./venv

      - name: Run pytest (Functional Tests)
        # This will run your test.py if you rename it to test_*.py 
        # or you can change this to: python -m unittest test.py
        run: python -m unittest test.py

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/secureshare:latest
            ghcr.io/${{ github.repository }}/secureshare:${{ github.ref_name }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### SecureShare Deployment
            The docker image for this version is available at:
            `docker pull ghcr.io/${{ github.repository }}/secureshare:${{ github.ref_name }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build & Release GUI Executables

on:
  push:
    tags:
      - "v*"

jobs:
  build-gui:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SecureShare-Linux
            output_file: SecureShare
          - os: windows-latest
            artifact_name: SecureShare-Windows
            output_file: SecureShare.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gui/requirements.txt
          pip install pyinstaller

      - name: Clean previous PyInstaller artifacts
        shell: bash
        run: |
          rm -rf build dist *.spec gui/__pycache__

      - name: Build GUI executable (OLD IMPORT SUPPORTED)
        shell: bash
        run: |
          pyinstaller \
            --clean \
            --onefile \
            --noconsole \
            --name SecureShare \
            --paths gui \
            gui/app.py

      - name: Verify build output
        shell: bash
        run: |
          echo "Contents of dist/:"
          ls -lh dist/

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.output_file }}

# .github/workflows/test.yml

name: SecureShare CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Run Bandit Security Scan
        run: |
          bandit -r . -f custom --msg-template "{abspath}:{line}: {severity}: {test_id} - {msg}" --exclude ./data,./venv,./env
        continue-on-error: false  # Fail the job if high-severity issues found

      - name: Run Flake8 (code style & basic errors)
        run: |
          pip install flake8
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics --exclude=data,__pycache__

      - name: Smoke Test - Start Application
        run: |
          echo "Starting SecureShare app for smoke test..."
          timeout 20s python main.py &
          APP_PID=$!
          sleep 12
          kill $APP_PID || true
          echo "✓ Application started successfully and ran for 12 seconds without crashing."